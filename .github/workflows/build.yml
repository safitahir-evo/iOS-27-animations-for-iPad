name: Build iPad deb

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "rootless or rootful"
        type: choice
        default: rootless
        options:
          - rootless
          - rootful

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ls -la
          unzip -q ios26-27-anims-1.5.5-ipad.zip
          ls -la ios26-27-anims-1.5.5

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build
        working-directory: ios26-27-anims-1.5.5
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ "$SCHEME" = "rootful" ]; then PKG_SCHEME=""; else PKG_SCHEME="rootless"; fi
          gmake -C iOS27Animations package FINALPACKAGE=1 \
            TARGET="iphone:clang:latest:15.0" THEOS_PACKAGE_SCHEME="$PKG_SCHEME"

      - uses: actions/upload-artifact@v4
        with:
          name: ios27animations-ipad-deb
          path: ios26-27-anims-1.5.5/iOS27Animations/packages/*.deb
